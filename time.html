<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Quickstart Demo</title>
  <!-- Load GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 2rem;
    }

    .card-container {
      display: flex;
      gap: 1rem;
    }

    .card {
      width: 100px;
      height: 120px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      /* GSAP will control opacity & transforms directly */
      opacity: 0; 
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background-color: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <button id="animateBtn">Play Animation</button>

  <div class="card-container">
    <div class="card">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
  </div>

  <script>
    // Create a GSAP Timeline (paused initially)
    const tl = gsap.timeline({ paused: true });

    // Build the animation sequence
    tl.fromTo(".card", 
      { 
        y: 80,          // Start 80px lower
        opacity: 0,     // Start completely transparent
        scale: 0.8      // Start slightly scaled down
      },
      { 
        y: 0,           // Move back to original position
        opacity: 1,     // Fade in
        scale: 1, 
        duration: 0.8,
        ease: "back.out(1.7)", // Elastic "pop" overshoot
        stagger: 0.15          // Animate cards 0.15s apart
      }
    );

    // Button click handler: plays or reverses the timeline
    const btn = document.getElementById("animateBtn");
    
    btn.addEventListener("click", () => {
      if (tl.progress() === 0 || tl.reversed()) {
        tl.play();
        btn.textContent = "Reverse Animation";
      } else {
        tl.reverse();
        btn.textContent = "Play Animation";
      }
    });
  </script>

</body>
</html>
